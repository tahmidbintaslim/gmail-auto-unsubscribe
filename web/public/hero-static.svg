<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 640" width="800" height="640">
  <!-- Static hero for reduced motion and no-WebGL: envelopes mid-sweep, the arc brushing them to the right. -->
  <defs>
    <linearGradient id="bristle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FB923C" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#FB923C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C2410C" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#7C2D12" flood-opacity="0.18"/>
    </filter>
    <symbol id="env" viewBox="0 0 160 104" overflow="visible">
      <rect x="1" y="1" width="158" height="102" rx="7" stroke="#D6BE9C" stroke-width="2"/>
      <path d="M4 6 L80 60 L156 6" fill="none" stroke="#C9AE88" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="124" y="14" width="22" height="26" rx="3" fill="#E8590C"/>
      <path d="M40 80 H104 M40 90 H88" stroke="#CDB594" stroke-width="3" stroke-linecap="round"/>
    </symbol>
  </defs>

  <g filter="url(#soft)">
    <use href="#env" xlink:href="#env" width="150" height="98" fill="#FBF3E7" transform="translate(470 70) rotate(-9)"/>
    <use href="#env" xlink:href="#env" width="130" height="85" fill="#F3E6D3" transform="translate(620 170) rotate(14)"/>
    <use href="#env" xlink:href="#env" width="160" height="104" fill="#FFF8EE" transform="translate(520 260) rotate(6)"/>
    <use href="#env" xlink:href="#env" width="120" height="78" fill="#EAD7BC" transform="translate(660 330) rotate(-18)"/>
    <use href="#env" xlink:href="#env" width="150" height="98" fill="#F7E9D7" transform="translate(470 420) rotate(-4)"/>
    <use href="#env" xlink:href="#env" width="125" height="82" fill="#FBF3E7" transform="translate(640 470) rotate(22)"/>
    <use href="#env" xlink:href="#env" width="110" height="72" fill="#F3E6D3" transform="translate(360 540) rotate(-12)"/>
    <use href="#env" xlink:href="#env" width="100" height="66" fill="#EAD7BC" transform="translate(150 470) rotate(10)" opacity="0.9"/>
    <use href="#env" xlink:href="#env" width="96" height="62" fill="#FBF3E7" transform="translate(110 110) rotate(-16)" opacity="0.85"/>
  </g>

  <!-- the sweep: a curved band of bristle strokes, leading edge on the right -->
  <g fill="none" stroke-linecap="round">
    <path d="M150 -20 C 260 160 300 380 250 660" stroke="url(#bristle)" stroke-width="150" opacity="0.35"/>
    <path d="M230 -20 C 340 160 380 380 330 660" stroke="#C2410C" stroke-width="10" opacity="0.9"/>
    <path d="M212 -20 C 322 160 362 380 312 660" stroke="#FB923C" stroke-width="4" opacity="0.8"/>
    <path d="M196 -20 C 306 160 346 380 296 660" stroke="#FB923C" stroke-width="3" opacity="0.55"/>
    <path d="M176 -20 C 286 160 326 380 276 660" stroke="#FB923C" stroke-width="2" opacity="0.4"/>
  </g>
</svg>
