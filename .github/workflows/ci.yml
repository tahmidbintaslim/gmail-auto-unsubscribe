name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # package.json "engines" also allows Node 26+, which CI does not test.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ext/package-lock.json
            web/package-lock.json
      - run: npm ci
      # v2 extension deps (ext/); its postinstall runs `wxt prepare`.
      - run: npm ci --prefix ext
      - run: npm test
      - run: npx tsc --noEmit
        working-directory: ext
      - run: npx wxt build
        working-directory: ext
      # Website: typecheck and build, then copy the demo into web/dist.
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npm run package
      - run: unzip -l dist/unsubsweep-*.zip
