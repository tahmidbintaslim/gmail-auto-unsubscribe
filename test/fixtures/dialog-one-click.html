<!-- Hand-written stand-in for the dialog Gmail shows for a sender it can
     unsubscribe you from in one click. -->
<div class="Kj-JD" role="alertdialog" aria-modal="true" aria-labelledby="unsub-title">
  <h3 id="unsub-title">Unsubscribe from {{name}}?</h3>
  <div class="buttons">
    <button>Cancel</button>
    <button>Unsubscribe</button>
  </div>
</div>
