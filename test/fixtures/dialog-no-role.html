<!-- A one-click dialog with no ARIA role, to cover the fallback that finds
     a dialog from its visible Cancel button. -->
<div class="unsub-popup">
  <div class="body">
    <div class="title">Unsubscribe from {{name}}?</div>
    <div class="buttons">
      <span role="button" tabindex="0">Cancel</span>
      <span role="button" tabindex="0">Unsubscribe</span>
    </div>
  </div>
</div>
