<!-- Hand-written stand-in for the dialog Gmail shows for a sender that
     handles unsubscribes on its own website. -->
<div role="dialog" aria-modal="true" aria-labelledby="site-title">
  <h3 id="site-title">Unsubscribe from {{name}}</h3>
  <p>This sender handles unsubscribe requests on its website.</p>
  <div class="buttons">
    <button>Cancel</button>
    <a href="https://{{domain}}/unsubscribe" target="_blank" rel="noopener">Go to website</a>
  </div>
</div>
