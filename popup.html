<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 230px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      color: #202124;
    }
    h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    #startBtn {
      background: #1a73e8;
      color: #fff;
    }
    #startBtn:hover {
      background: #1557b0;
    }
    #stopBtn {
      background: #f1f3f4;
      color: #3c4043;
    }
    #stopBtn:hover {
      background: #e8eaed;
    }
    #status {
      font-size: 12px;
      color: #5f6368;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h3>Gmail Unsubscriber</h3>
  <button id="startBtn">Start Unsubscribing</button>
  <button id="stopBtn">Stop</button>
  <div id="status">Ready</div>

  <script src="popup.js"></script>
</body>
</html>
