<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    /* Figtree, the website's typeface, shipped with the extension (no font request leaves the browser). */
    @font-face { font-family: "Figtree"; src: url("fonts/figtree.woff2") format("woff2"); font-weight: 300 900; }
    /* UnsubSweep tokens, matched to the website. Dark values follow the OS theme. */
    :root {
      --bg: #FFFFFF;
      --fg: #2A1220;
      --muted: #5E4A55;
      --accent: #C2360F;
      --accent-fg: #FFFFFF;
      --surface: #FFF4EE;
      --focus: #C2360F;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1B0C15;
        --fg: #FFF4EE;
        --muted: #C9B5BF;
        --accent: #FF8A65;
        --accent-fg: #1B0C15;
        --surface: #2A1220;
        --focus: #FF8A65;
      }
    }
    body {
      width: 240px;
      font-family: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      color: var(--fg);
      background: var(--bg);
    }
    h1 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    h1 img {
      width: 20px;
      height: 20px;
    }
    button {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    #startBtn {
      background: var(--accent);
      color: var(--accent-fg);
    }
    #startBtn:disabled {
      opacity: 0.55;
      cursor: default;
    }
    #startBtn:hover:not(:disabled) {
      /* darker on hover keeps text contrast above 4.5:1 in both themes */
      filter: brightness(0.92);
    }
    #stopBtn {
      background: var(--surface);
      color: var(--fg);
    }
    #stopBtn:hover {
      filter: brightness(0.96);
    }
    #status {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin-top: 6px;
    }
    .option {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      margin: 2px 0 10px;
    }
    .option input {
      margin: 1px 0 0;
      accent-color: var(--accent);
    }
  </style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt=""> UnsubSweep</h1>
  <label class="option">
    <input id="allowWebsites" type="checkbox">
    When a sender has no one-click unsubscribe, open its "Go to website" link (up to 5 per run)
  </label>
  <button id="startBtn">Start sweep</button>
  <button id="stopBtn">Stop</button>
  <div id="status" role="status" aria-live="polite">Ready</div>

  <script src="unsubscriber.js"></script>
  <script src="popup.js"></script>
</body>
</html>
